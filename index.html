<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gran Rifa Solidaria</title>
  <style>
    :root {
      --primary: #15803d;
      --primary-hover: #166534;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #cbd5e1;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    h1, h2 {
      text-align: center;
      color: var(--primary);
    }

    .info-box {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 0.95rem;
    }

    .euro-rate {
      font-weight: bold;
      color: #b91c1c;
      margin-top: 5px;
    }

    .countdown {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 4px;
    }

    /* GRILLA DE BOLETOS */
    .grid-container {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
      gap: 6px;
      background: #fafafa;
    }

    .num {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e2e8f0;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .num:hover {
      background: #cbd5e1;
    }

    .num.sel {
      background: var(--primary);
      color: white;
    }

    .num.taken {
      background: #94a3b8;
      color: #cbd5e1;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    /* FORMULARIO */
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    input, select {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
    }

    button.submit-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    button.submit-btn:hover {
      background: var(--primary-hover);
    }

    footer {
      text-align: center;
      margin-top: 25px;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gran Rifa Solidaria</h1>
    
    <div class="info-box">
      <div>Selecciona tu(s) número(s) favorito(s) de la lista inferior</div>
      <div id="euroRate" class="euro-rate">Cargando Tasa Euro...</div>
      <div id="countdown" class="countdown"></div>
    </div>

    <!-- GRILLA DE 1000 BOLETOS -->
    <label>Boletos (000 - 999):</label>
    <div id="grid" class="grid-container"></div>

    <!-- FORMULARIO DE RESERVA -->
    <form id="raffleForm">
      <div>
        <label for="nombre">Nombre y Apellido:</label>
        <input type="text" id="nombre" required placeholder="Ej. María Pérez">
      </div>

      <div>
        <label for="tel">Teléfono / WhatsApp:</label>
        <input type="tel" id="tel" required placeholder="Ej. 04121234567">
      </div>

      <div>
        <label for="metodo">Método de Pago:</label>
        <select id="metodo">
          <option value="Pago Móvil">Pago Móvil</option>
          <option value="Zelle">Zelle</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Binance">Binance</option>
        </select>
      </div>

      <button type="submit" class="submit-btn">Reservar por WhatsApp</button>
    </form>

    <footer>
      &copy; <span id="year">2026</span> - Todos los derechos reservados.
    </footer>
  </div>

  <!-- LÓGICA DE FIREBASE (BOLETOS + TASA EURO EN TIEMPO REAL) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    document.getElementById('year').textContent = new Date().getFullYear();

    // TEMPORIZADOR DEL SORTEO
    const target = new Date("2026-08-21T21:50:00").getTime();
    setInterval(() => {
        const diff = target - new Date().getTime();
        const d = Math.floor(diff / (1000*60*60*24));
        const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
        const m = Math.floor((diff % (1000*60*60)) / (1000*60));
        document.getElementById("countdown").innerHTML = `(${d}d ${h}h ${m}m restantes)`;
    }, 1000);

    // INICIALIZACIÓN DE FIREBASE
    const db = getDatabase(initializeApp({
      apiKey: "AIzaSyAkO4NC8uZOLyKnUzkEPTSWE95gslYaWes", 
      databaseURL: "https://rifa-app-9a924-default-rtdb.firebaseio.com"
    }));

    // 1. LECTURA DE LA TASA DEL EURO EN TIEMPO REAL DESDE FIREBASE
    const euroElem = document.getElementById('euroRate');
    onValue(ref(db, 'config/tasa_euro'), (snapshot) => {
      const val = snapshot.val();
      if (val) {
        const valorFormateado = parseFloat(val).toFixed(2).replace('.', ',');
        euroElem.innerText = `Pago Tasa Euro según el BCV: Bs. ${valorFormateado}`;
      } else {
        euroElem.innerText = `Pago Tasa Euro según el BCV: Consultar reporte del día`;
      }
    });

    // 2. GESTIÓN DE BOLETOS
    let seleccion = [];
    
    onValue(ref(db, 'boletos_ocupados'), (s) => {
      const bloq = s.val() ? new Set(Object.keys(s.val()).map(Number)) : new Set();
      const g = document.getElementById('grid');
      g.innerHTML = '';
      for(let i=0; i<1000; i++) {
        let d = document.createElement('div');
        d.className = 'num ' + (bloq.has(i) ? 'taken' : (seleccion.includes(i) ? 'sel' : ''));
        d.textContent = i.toString().padStart(3, '0');
        d.onclick = () => { if(!bloq.has(i)) { 
            const idx = seleccion.indexOf(i);
            idx > -1 ? seleccion.splice(idx, 1) : seleccion.push(i);
            renderizar(bloq);
        }};
        g.appendChild(d);
      }
    });

    function renderizar(bloq) {
        document.querySelectorAll('.num').forEach((el, i) => {
            el.className = 'num ' + (bloq.has(i) ? 'taken' : (seleccion.includes(i) ? 'sel' : ''));
        });
    }

    // 3. ENVÍO DEL FORMULARIO Y RESERVA EN FIREBASE
    document.getElementById('raffleForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (seleccion.length === 0) { alert("Por favor selecciona al menos un número"); return; }
        
        const nombre = document.getElementById('nombre').value;
        const tel = document.getElementById('tel').value;
        const metodo = document.getElementById('metodo').value;
        const boletos = seleccion.map(x => x.toString().padStart(3, '0')).join(', ');
        
        update(ref(db, 'boletos_ocupados'), seleccion.reduce((acc, n) => ({...acc, [n]: {nombre, tel, metodo}}), {}));
        const msg = `¡Hola!👋 Muchas gracias por tu colaboración.\n\n*Datos de la reserva:*\n*Nombre:* ${nombre}\n*Teléfono:* ${tel}\n*Boletos Reservados:* ${boletos}\n*Método de pago:* ${metodo}\n\nRecuerda que tu número participa oficialmente al haber cancelado el valor del boleto. Si hiciste transferencia, por favor enviar comprobante de pago.`;

        window.location.href = 'https://wa.me/584247384214?text=' + encodeURIComponent(msg);
    });
  </script>

</body>
</html>
