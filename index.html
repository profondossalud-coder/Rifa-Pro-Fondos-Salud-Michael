<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Fondos Salud Michael Mora - Gran Rifa</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #28a745;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .tickets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            background: #fafafa;
        }

        .ticket {
            padding: 10px 5px;
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            user-select: none;
            transition: all 0.2s ease;
        }

        .ticket.selected {
            background-color: var(--secondary-color);
            color: white;
            border-color: #1e7e34;
        }

        .ticket.occupied {
            background-color: #dc3545;
            color: white;
            cursor: not-allowed;
            opacity: 0.6;
            text-decoration: line-through;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #004085;
        }

        .status-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pro-Fondos Salud Michael Mora</h1>
    <p class="subtitle">Organiza: Equipo Dalanmar</p>

    <form id="raffleForm">
        <div class="form-group">
            <label for="nombre">Nombres y Apellidos:</label>
            <input type="text" id="nombre" placeholder="Ingresa tu nombre completo" required>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono (WhatsApp):</label>
            <input type="tel" id="telefono" placeholder="Ej: 04141234567" required>
        </div>

        <div class="form-group">
            <label>Selecciona tus boletos:</label>
            <div class="tickets-grid" id="ticketsGrid">
                <!-- Se generan dinámicamente con JS -->
            </div>
        </div>

        <button type="submit" class="btn-submit">Reservar Boletos</button>
    </form>

    <div class="status-msg" id="statusMessage"></div>
</div>

<script>
    // DATOS DE INTEGRACIÓN CON GOOGLE FORMS
    const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdP90cVfchJqMyfYcxUCFYKcyNcH25auxYl7IQj9vubvfFpDQ/formResponse';
    const ENTRY_NOMBRE = 'entry.874598015';
    const ENTRY_TELEFONO = 'entry.1349990828';
    const ENTRY_BOLETOS = 'entry.866989850';

    const TOTAL_BOLETOS = 1000;
    const boletosSeleccionados = new Set();
    
    // Aquí puedes incluir los números ya vendidos/ocupados si los tienes (Ej: ['005', '012', '150'])
    const boletosOcupados = []; 

    const grid = document.getElementById('ticketsGrid');

    // Generar la lista de números (000 - 999)
    function cargarBoletos() {
        grid.innerHTML = '';
        for (let i = 0; i < TOTAL_BOLETOS; i++) {
            const numStr = String(i).padStart(3, '0');
            const ticket = document.createElement('div');
            ticket.classList.add('ticket');
            ticket.textContent = numStr;

            if (boletosOcupados.includes(numStr)) {
                ticket.classList.add('occupied');
            } else {
                ticket.addEventListener('click', () => toggleBoleto(ticket, numStr));
            }

            grid.appendChild(ticket);
        }
    }

    function toggleBoleto(element, numero) {
        if (boletosSeleccionados.has(numero)) {
            boletosSeleccionados.delete(numero);
            element.classList.remove('selected');
        } else {
            boletosSeleccionados.add(numero);
            element.classList.add('selected');
        }
    }

    // Envío silencioso en segundo plano a Google Forms
    function enviarAGoogleForm(nombre, telefono, boletosText) {
        const formData = new FormData();
        formData.append(ENTRY_NOMBRE, nombre);
        formData.append(ENTRY_TELEFONO, telefono);
        formData.append(ENTRY_BOLETOS, boletosText);

        fetch(FORM_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: formData
        })
        .then(() => {
            console.log('Reserva registrada en Google Forms exitosamente.');
        })
        .catch(error => {
            console.error('Error al registrar la reserva:', error);
        });
    }

    // Manejador del Formulario
    document.getElementById('raffleForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const nombre = document.getElementById('nombre').value.trim();
        const telefono = document.getElementById('telefono').value.trim();
        const msgDiv = document.getElementById('statusMessage');

        if (boletosSeleccionados.size === 0) {
            msgDiv.style.color = '#dc3545';
            msgDiv.textContent = 'Por favor, selecciona al menos un boleto.';
            return;
        }

        const listaBoletos = Array.from(boletosSeleccionados).join(', ');

        // Guardar la información en Google Forms
        enviarAGoogleForm(nombre, telefono, listaBoletos);

        // Confirmación visual al comprador
        msgDiv.style.color = '#28a745';
        msgDiv.textContent = '¡Reserva procesada con éxito! Tus números: ' + listaBoletos;

        // Limpiar formulario
        document.getElementById('raffleForm').reset();
        boletosSeleccionados.clear();
        cargarBoletos();
    });

    // Inicializar la cuadrícula al cargar
    cargarBoletos();
</script>

</body>
</html>
