<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎟️ Rifa 1000 - Operación Salud</title>

  <style>
    /* ... (Mantenemos tus mismos estilos originales) ... */
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: radial-gradient(circle at center, #00416A 0%, #002642 60%, #001220 100%); background-attachment: fixed; margin: 0; padding: 16px; color: #2c3e50; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-top: 10px; margin-bottom: 20px; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-weight: 800; font-size: 1.8rem; }
    .card { background: linear-gradient(145deg, #ffffff, #f0f2f5); padding: 20px; border-radius: 16px; margin: 16px 0; box-shadow: 0 10px 25px rgba(0,0,0,0.25); border: 1px solid #dcdfe6; }
    .btn-wa { background: linear-gradient(135deg, #25d366, #128c7e); color: #ffffff; padding: 15px 16px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.05rem; }
    input { width: 100%; padding: 12px; margin: 6px 0 16px 0; border: 1px solid #b0bec5; border-radius: 8px; font-size: 1rem; }
  </style>
</head>
<body>

  <!-- Iframe invisible para capturar el envío del formulario -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <div class="container">
    <h1>🎟️ Rifa 1000 - Operación Salud</h1>

    <!-- FORMULARIO: El "target" hace que se envíe al iframe invisible -->
    <form id="raffleForm" action="https://docs.google.com/forms/d/e/1FAIpQLSdP90cVfchJqMyfYcxUCFYKcyNcH25auxYl7IQj9vubvfFpDQ/formResponse" method="POST" target="hidden_iframe">
      
      <div class="card">
        <div id="grid">Cargando números...</div>
      </div>

      <div class="card">
        <!-- Los "name" deben ser exactos para que Google Forms los reciba -->
        <label for="nombre"><b>Nombre completo:</b></label>
        <input name="entry.874598015" id="nombre" placeholder="Ej: María Pérez" required>
        
        <label for="tel"><b>Teléfono:</b></label>
        <input name="entry.1349990828" id="tel" type="tel" placeholder="Ej: 04141234567" required>
        
        <!-- Campo oculto para los boletos -->
        <input name="entry.866989850" id="hiddenBoletos" type="hidden">
        
        <button type="submit" id="btnWa" class="btn-wa">📲 Reservar y enviar por WhatsApp</button>
      </div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { /* ... tu configuración aquí ... */ };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const boletosOcupadosRef = ref(db, 'boletos_ocupados');

    let seleccion = [];
    const btn = document.getElementById('btnWa');

    // ... (Mantén aquí tu lógica de construirTablero y Firebase) ...

    document.getElementById('raffleForm').addEventListener('submit', async function(e) {
      // Evitamos el envío inmediato para guardar primero en Firebase
      e.preventDefault(); 
      
      const nombre = document.getElementById('nombre').value.trim();
      const tel = document.getElementById('tel').value.trim();
      const numerosTexto = seleccion.map(x => String(x).padStart(3, '0')).join(', ');
      
      // 1. Guardar en Firebase
      const nuevasReservas = {};
      seleccion.forEach(num => nuevasReservas[`boletos_ocupados/${num}`] = { nombre, tel, timestamp: new Date().toISOString() });
      await update(ref(db), nuevasReservas);

      // 2. Colocar los boletos en el campo oculto
      document.getElementById('hiddenBoletos').value = numerosTexto;

      // 3. ENVIAR FORMULARIO (Esto dispara el envío al iframe invisible)
      this.submit();

      // 4. Redirección a WhatsApp
      const totalCOP = seleccion.length * 10000;
      const totalUSD = seleccion.length * 3;
      const msg = `¡Muchas gracias por tu colaboración! Recuerda que tu número participa oficialmente al haber cancelado el valor del boleto. Si hiciste transferencia, por favor enviar comprobante de pago.\n\n` +
                  `*Datos de la reserva:*\n` +
                  `*Nombre:* ${nombre}\n` +
                  `*Teléfono:* ${tel}\n` +
                  `*Boletos Reservados:* ${numerosTexto}\n` +
                  `*Total a pagar:* $${totalCOP.toLocaleString('es-CO')} COP / $${totalUSD} USD`;

      window.location.href = 'https://wa.me/584247384214?text=' + encodeURIComponent(msg);
    });
  </script>
</body>
</html>
