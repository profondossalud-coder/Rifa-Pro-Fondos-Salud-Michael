<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎟️ Rifa 1000 - Operación Salud</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at center, #00416A 0%, #002642 60%, #001220 100%); background-attachment: fixed; margin: 0; padding: 16px; color: #2c3e50; }
    .container { max-width: 800px; margin: auto; }
    
    .brand-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; }
    .brand-header img { 
        width: 80px; 
        height: 80px; 
        object-fit: cover; 
        border-radius: 50%; 
        border: 3px solid rgba(255,255,255,0.3); 
        background-color: white;
    }
    .brand-header h1 { 
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-weight: 700; 
        font-size: 2.8rem; 
        margin: 0; 
        background: linear-gradient(to bottom, #FFD700, #FDB931);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    }

    .card { background: linear-gradient(145deg, #ffffff, #f0f2f5); padding: 20px; border-radius: 16px; margin: 16px 0; box-shadow: 0 10px 25px rgba(0,0,0,0.25); border: 1px solid #dcdfe6; }
    
    .price-tag { font-size: 1.2rem; color: #1b5e20; background: linear-gradient(135deg, #e8f5e9, #c8e6c9); padding: 12px; border-radius: 10px; display: block; margin-bottom: 12px; font-weight: bold; border: 1px solid #a5d6a7; text-align: center; }
    .price-sub { display: block; font-size: 0.85rem; color: #555; font-weight: normal; margin-top: 4px; }
    
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; padding: 10px; background: #f8f9fa; border: 1px solid #cfd8dc; border-radius: 12px; }
    .num { padding: 10px 2px; text-align: center; border-radius: 8px; color: #fff; cursor: pointer; font-size: 0.85rem; font-weight: bold; background: linear-gradient(135deg, #2e7d32, #1b5e20); }
    .taken { background: linear-gradient(135deg, #e53935, #b71c1c); opacity: 0.55; cursor: not-allowed; }
    .sel { background: linear-gradient(135deg, #ff9800, #e65100); }
    
    /* --- NUEVOS ESTILOS MÉTODOS DE PAGO --- */
    .payment-container { margin-top: 15px; }
    .payment-title { font-weight: bold; color: #00416A; margin-bottom: 10px; font-size: 1.05rem; }
    
    .payment-methods-list { display: flex; flex-direction: column; gap: 10px; }
    
    .method-item { 
        background: #ffffff; 
        border: 1px solid #cfd8dc; 
        border-radius: 10px; 
        padding: 12px; 
    }
    
    .method-header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 8px; 
        font-weight: bold; 
        color: #1e293b;
    }
    
    .bank-badge { 
        background: #e2e8f0; 
        color: #00416A; 
        font-size: 0.8rem; 
        padding: 2px 8px; 
        border-radius: 6px; 
    }
    
    .detail-row { 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        background: #f8f9fa; 
        padding: 8px 12px; 
        border-radius: 8px; 
        margin-top: 6px; 
        border: 1px solid #e9ecef; 
    }
    
    .detail-info { display: flex; align-items: center; gap: 8px; }
    .detail-label { font-size: 0.85rem; color: #64748b; }
    .detail-value { font-weight: bold; font-family: monospace; font-size: 1rem; color: #0f172a; }
    
    .copy-btn { 
        background: #e0e6ed; 
        border: none; 
        border-radius: 6px; 
        padding: 6px 10px; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        gap: 4px; 
        font-size: 0.8rem; 
        color: #334155; 
        transition: all 0.2s ease; 
    }
    .copy-btn:hover { background: #cbd5e1; }
    .copy-btn.copied { background: #22c55e; color: #ffffff; }

    .date-info { margin-top: 15px; font-weight: bold; color: #d32f2f; text-align: center; }

    input { width: 100%; padding: 12px; margin: 6px 0 16px 0; border: 1px solid #b0bec5; border-radius: 8px; }
    .btn-wa { background: linear-gradient(135deg, #25d366, #128c7e); color: #ffffff; padding: 15px; border: none; border-radius: 10px; font-weight: bold; width: 100%; font-size: 1.05rem; cursor: pointer; }

    footer { text-align: center; padding: 20px; color: #ffffff; font-size: 0.85rem; margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <img src="logo.png" alt="Logo">
      <h1>Rifa 1000</h1>
    </div>

    <form id="raffleForm">
      <div class="card">
        <div class="price-tag">
            Valor: $10.000 COP / $3 
            <span class="price-sub">(A tasa del Euro del día)</span>
        </div>
        <div id="grid"></div>
        
        <!-- NUEVO BLOQUE DE MÉTODOS DE PAGO -->
        <div class="payment-container">
            <div class="payment-title">Métodos de Pago:</div>
            <div class="payment-methods-list">
              
              <!-- Efectivo -->
              <div class="method-item">
                💵 <strong>Efectivo</strong>
              </div>

              <!-- Pago Móvil -->
              <div class="method-item">
                <div class="method-header">
                  <span>📲 Pago Móvil</span>
                  <span class="bank-badge">Banco Mercantil</span>
                </div>

                <!-- Fila Cédula -->
                <div class="detail-row">
                  <div class="detail-info">
                    <span class="detail-label">C.I.:</span>
                    <span class="detail-value" id="ci-num">21003960</span>
                  </div>
                  <button type="button" class="copy-btn" onclick="copyToClipboard('ci-num', this)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                    </svg>
                    <span>Copiar</span>
                  </button>
                </div>

                <!-- Fila Teléfono -->
                <div class="detail-row">
                  <div class="detail-info">
                    <span class="detail-label">Teléfono:</span>
                    <span class="detail-value" id="phone-num">04147179001</span>
                  </div>
                  <button type="button" class="copy-btn" onclick="copyToClipboard('phone-num', this)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                    </svg>
                    <span>Copiar</span>
                  </button>
                </div>

              </div>
            </div>

            <div class="date-info">📅 Sorteo: 21 de agosto. <span id="countdown"></span></div>
        </div>
      </div>

      <div class="card">
        <label><b>Nombre completo:</b></label>
        <input id="nombre" placeholder="Ej: María Pérez" required>
        
        <label><b>Teléfono:</b></label>
        <input id="tel" placeholder="Ej: 04141234567" required>
        
        <label><b>Método de pago:</b></label>
        <input id="metodo" placeholder="Ej: Efectivo / Pago Móvil / Otro" required>
        
        <button type="submit" class="btn-wa">📲 Reservar y enviar por WhatsApp</button>
      </div>
    </form>
    
    <footer>
      <p>&copy; <span id="year"></span> Rifa 1000 - Operación Salud. Todos los derechos reservados.</p>
      <p>Programado por: <strong>@nathaliemarinvel</strong></p>
    </footer>
  </div>

  <script>
    // Función global para copiar datos al portapapeles
    function copyToClipboard(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = '✓ ¡Copiado!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = originalText;
        }, 1800);
      });
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    document.getElementById('year').textContent = new Date().getFullYear();

    const target = new Date("2026-08-21T21:50:00").getTime();
    setInterval(() => {
        const diff = target - new Date().getTime();
        const d = Math.floor(diff / (1000*60*60*24));
        const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
        const m = Math.floor((diff % (1000*60*60)) / (1000*60));
        document.getElementById("countdown").innerHTML = `(${d}d ${h}h ${m}m restantes)`;
    }, 1000);

    const db = getDatabase(initializeApp({apiKey: "AIzaSyAkO4NC8uZOLyKnUzkEPTSWE95gslYaWes", databaseURL: "https://rifa-app-9a924-default-rtdb.firebaseio.com"}));
    let seleccion = [];
    
    onValue(ref(db, 'boletos_ocupados'), (s) => {
      const bloq = s.val() ? new Set(Object.keys(s.val()).map(Number)) : new Set();
      const g = document.getElementById('grid');
      g.innerHTML = '';
      for(let i=0; i<1000; i++) {
        let d = document.createElement('div');
        d.className = 'num ' + (bloq.has(i) ? 'taken' : (seleccion.includes(i) ? 'sel' : ''));
        d.textContent = i.toString().padStart(3, '0');
        d.onclick = () => { if(!bloq.has(i)) { 
            const idx = seleccion.indexOf(i);
            idx > -1 ? seleccion.splice(idx, 1) : seleccion.push(i);
            renderizar(bloq);
        }};
        g.appendChild(d);
      }
    });

    function renderizar(bloq) {
        document.querySelectorAll('.num').forEach((el, i) => {
            el.className = 'num ' + (bloq.has(i) ? 'taken' : (seleccion.includes(i) ? 'sel' : ''));
        });
    }

    document.getElementById('raffleForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (seleccion.length === 0) { alert("Por favor selecciona al menos un número"); return; }
        
        const nombre = document.getElementById('nombre').value;
        const tel = document.getElementById('tel').value;
        const metodo = document.getElementById('metodo').value;
        const boletos = seleccion.map(x => x.toString().padStart(3, '0')).join(', ');
        
        update(ref(db, 'boletos_ocupados'), seleccion.reduce((acc, n) => ({...acc, [n]: {nombre, tel, metodo}}), {}));
        const msg = `¡Hola!👋 Muchas gracias por tu colaboración.\n\n*Datos de la reserva:*\n*Nombre:* ${nombre}\n*Teléfono:* ${tel}\n*Boletos Reservados:* ${boletos}\n*Método de pago:* ${metodo}\n\nRecuerda que tu número participa oficialmente al haber cancelado el valor del boleto. Si hiciste transferencia, por favor enviar comprobante de pago.`;

        window.location.href = 'https://wa.me/584247384214?text=' + encodeURIComponent(msg);
    });
  </script>
</body>
</html>
