<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rifa Gran Sorteo - Pro-Fondos Salud</title>
  <style>
    :root {
      --primary-color: #0d6efd;
      --secondary-color: #198754;
      --bg-color: #f8f9fa;
      --text-color: #212529;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1, h2 {
      text-align: center;
      color: #1a252f;
    }

    /* Estilos del Contador Regresivo */
    .timer-container {
      background: #e9ecef;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }

    .timer {
      font-size: 1.4rem;
      font-weight: bold;
      color: #dc3545;
    }

    /* Formulario de Registro */
    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      box-sizing: border-box;
    }

    /* Cuadrícula de Números */
    .numbers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .number-btn {
      padding: 10px 5px;
      background-color: #e2e3e5;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }

    .number-btn.selected {
      background-color: var(--primary-color);
      color: white;
    }

    .number-btn.occupied {
      background-color: #dc3545;
      color: white;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--secondary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-submit:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Pro-Fondos Salud Michael Mora</h1>
  
  <!-- Reloj Contador Regresivo -->
  <div class="timer-container">
    <span>El sorteo cierra en:</span>
    <div id="countdown" class="timer">Cargando tiempo...</div>
  </div>

  <form id="raffleForm">
    <div class="form-group">
      <label for="nombre">Nombre y Apellido:</label>
      <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono / WhatsApp:</label>
      <input type="tel" id="telefono" required placeholder="Ej. 04141234567">
    </div>

    <h2>Selecciona tu(s) Número(s)</h2>
    <div class="numbers-grid" id="numbersGrid">
      <!-- Los números se generan dinámicamente -->
    </div>

    <button type="submit" id="btnReservar" class="btn-submit">Reservar y Enviar a WhatsApp</button>
  </form>
</div>

<script>
  // CONFIGURACIÓN GLOBAL
  const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/1J6cWpZBnxTwqD3Fel_AuEVOFSyIXkgCDDeAQJElO1cA/formResponse";
  const NUMERO_WHATSAPP = "584140000000"; // Reemplaza con tu número de WhatsApp
  const FECHA_LIMITE = new Date("August 21, 2026 23:59:59").getTime();

  // Códigos de las casillas en tu Google Form (entradas exactas):
  const ENTRY_NOMBRE = "entry.874598015";
  const ENTRY_TELEFONO = "entry.1349990828";
  const ENTRY_NUMEROS = "entry.866989850";
  const ENTRY_VENDEDOR = "entry.939498665";

  let numerosSeleccionados = [];

  // 1. GENERACIÓN DE NÚMEROS (1 al 1000)
  const grid = document.getElementById('numbersGrid');
  for (let i = 1; i <= 1000; i++) {
    const numFormateado = String(i).padStart(3, '0');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'number-btn';
    btn.textContent = numFormateado;
    
    btn.addEventListener('click', () => toggleNumero(btn, numFormateado));
    grid.appendChild(btn);
  }

  function toggleNumero(btn, numero) {
    if (btn.classList.contains('occupied')) return;

    if (numerosSeleccionados.includes(numero)) {
      numerosSeleccionados = numerosSeleccionados.filter(n => n !== numero);
      btn.classList.remove('selected');
    } else {
      numerosSeleccionados.push(numero);
      btn.classList.add('selected');
    }
  }

  // 2. RELOJ CONTADOR REGRESIVO
  const countdownEl = document.getElementById("countdown");
  const btnReservar = document.getElementById("btnReservar");

  const timerInterval = setInterval(() => {
    const ahora = new Date().getTime();
    const distancia = FECHA_LIMITE - ahora;

    if (distancia < 0) {
      clearInterval(timerInterval);
      countdownEl.innerHTML = "¡Sorteo Cerrado!";
      btnReservar.disabled = true;
      btnReservar.innerText = "Reservaciones Cerradas";
      return;
    }

    const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

    countdownEl.innerHTML = `${dias}d ${horas}h ${minutos}m ${segundos}s`;
  }, 1000);

  // 3. ENVÍO SILENCIOSO Y REDIRECCIÓN A WHATSAPP
  document.getElementById('raffleForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (numerosSeleccionados.length === 0) {
      alert("Por favor, selecciona al menos un número.");
      return;
    }

    const nombre = document.getElementById('nombre').value;
    const telefono = document.getElementById('telefono').value;
    const numerosTexto = numerosSeleccionados.join(', ');

    btnReservar.disabled = true;
    btnReservar.innerText = "Procesando reserva...";

    // Preparar datos para Google Form
    const formData = new FormData();
    formData.append(ENTRY_NOMBRE, nombre);
    formData.append(ENTRY_TELEFONO, telefono);
    formData.append(ENTRY_NUMEROS, numerosTexto);
    formData.append(ENTRY_VENDEDOR, 'WebRifa');

    try {
      // Envío en segundo plano sin cambiar de página
      await fetch(GOOGLE_FORM_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      });
    } catch (err) {
      console.error("Error guardando datos en Google Form:", err);
    }

    // Redirección directa a WhatsApp
    const mensajeWS = `¡Hola! Mi nombre es ${nombre}. Acabo de reservar el/los número(s): *${numerosTexto}*. Quedo a la espera para enviar el comprobante de pago.`;
    const urlWhatsApp = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensajeWS)}`;

    window.location.href = urlWhatsApp;
  });
</script>

</body>
</html>
