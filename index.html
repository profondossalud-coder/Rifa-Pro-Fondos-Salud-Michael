<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rifa 1000 - Operación Salud</title>
  <style>
    body { background: radial-gradient(circle at center, #00416A 0%, #002642 60%, #001220 100%); background-attachment: fixed; font-family: sans-serif; padding: 20px; color: #fff; }
    .container { max-width: 600px; margin: auto; }
    .card { background: #fff; color: #333; padding: 20px; border-radius: 15px; margin-top: 20px; }
    .payment-info { font-size: 0.9rem; margin-bottom: 15px; }
    .countdown-small { font-size: 0.8rem; color: #666; margin-top: 5px; }
    #grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin: 10px 0; }
    .num { padding: 8px; text-align: center; border-radius: 5px; cursor: pointer; background: #2e7d32; color: #fff; font-size: 14px; }
    .taken { background: #e53935; cursor: not-allowed; }
    .sel { background: #ff9800; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { width: 100%; padding: 15px; background: #25d366; color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎟️ Rifa 1000 - Operación Salud</h1>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
  <form id="raffleForm" action="https://docs.google.com/forms/d/e/1FAIpQLSdP90cVfchJqMyfYcxUCFYKcyNcH25auxYl7IQj9vubvfFpDQ/formResponse" method="POST" target="hidden_iframe">
    
    <div class="card">
      <div class="payment-info">
        <p>Valor: $10.000 COP / $3 por número</p>
        <p><b>Métodos de pago:</b></p>
        <p>• Efectivo<br>• Pago Móvil: Banco Mercantil, C.I. 21.003.960, Telf: 04147179001</p>
        <hr>
        <p>Fecha del sorteo: 21 de agosto</p>
        <div id="countdown" class="countdown-small">Cargando...</div>
      </div>
      <div id="grid"></div>
    </div>

    <div class="card">
      <input name="entry.874598015" id="nombre" placeholder="Nombre completo" required>
      <input name="entry.1349990828" id="tel" placeholder="Teléfono" required>
      <input name="entry.866989850" id="hiddenBoletos" type="hidden">
      <button type="submit">📲 Reservar y enviar por WhatsApp</button>
    </div>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Cuenta regresiva
  const targetDate = new Date("2026-08-21T00:00:00").getTime();
  function updateTimer() {
    const now = new Date().getTime();
    const distance = targetDate - now;
    const d = Math.floor(distance / (1000 * 60 * 60 * 24));
    const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    document.getElementById("countdown").innerHTML = `Faltan: ${d}d ${h}h ${m}m`;
  }
  setInterval(updateTimer, 1000);
  updateTimer();

  const firebaseConfig = { apiKey: "AIzaSyAkO4NC8uZOLyKnUzkEPTSWE95gslYaWes", databaseURL: "https://rifa-app-9a924-default-rtdb.firebaseio.com" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let seleccion = [];
  let bloqueados = new Set();

  onValue(ref(db, 'boletos_ocupados'), (snapshot) => {
    const data = snapshot.val();
    bloqueados = data ? new Set(Object.keys(data).map(Number)) : new Set();
    render();
  });

  function render() {
    const g = document.getElementById('grid');
    g.innerHTML = '';
    for (let i = 0; i < 1000; i++) {
      let d = document.createElement('div');
      d.className = 'num ' + (bloqueados.has(i) ? 'taken' : (seleccion.includes(i) ? 'sel' : ''));
      d.textContent = i.toString().padStart(3, '0');
      d.onclick = () => {
        if (bloqueados.has(i)) return;
        const idx = seleccion.indexOf(i);
        idx > -1 ? seleccion.splice(idx, 1) : seleccion.push(i);
        render();
      };
      g.appendChild(d);
    }
  }

  document.getElementById('raffleForm').addEventListener('submit', function() {
    const nombre = document.getElementById('nombre').value;
    const numeros = seleccion.map(x => x.toString().padStart(3, '0')).join(', ');
    document.getElementById('hiddenBoletos').value = numeros;
    
    const updates = {};
    seleccion.forEach(n => updates['boletos_ocupados/' + n] = { nombre });
    update(ref(db), updates);

    const msg = `¡Muchas gracias por tu colaboración! Recuerda enviar tu comprobante de pago.\n\nDatos:\nNombre: ${nombre}\nBoletos: ${numeros}`;
    setTimeout(() => {
      window.location.href = 'https://wa.me/584247384214?text=' + encodeURIComponent(msg);
    }, 500);
  });
</script>
</body>
</html>
